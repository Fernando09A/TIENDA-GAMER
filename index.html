<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Gamers - Juega Sin Límites</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
 
    <div class="fullscreen-wrapper">
        
        <div class="bg-effects">
            <div class="ambient-glow"></div>
            <div class="ring ring-outer"></div>
            <div class="ring ring-inner"></div>
            <div class="sphere-main">
                <div class="sphere-glint"></div>
            </div>
            <div class="sphere-small"></div>
        </div>
 
        <header class="navbar">
            <div class="logo">
                <div class="logo-icon">TG</div>
                <div class="logo-text">
                    <span class="top">TIENDA</span>
                    <span class="bottom">GAMERS</span>
                </div>
            </div>
 
            <nav class="nav-links">
                <a href="#">JUEGOS</a>
                <a href="#">OFERTAS</a>
                <a href="#">NOSOTROS</a>
            </nav>
 
            <div class="cart-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <span class="cart-badge"></span>
            </div>
        </header>
 
        <main class="hero">
            <div class="hero-content">
                <div class="eyebrow">
                    <span class="line"></span>
                    <span>SELECCIÓN DE LA SEMANA</span>
                </div>
 
                <h1 class="hero-title">
                    JUEGA SIN<br>
                    <span class="outline-text">LÍMITES.</span>
                </h1>
 
                <p class="hero-subtitle">
                    Descubre mundos extraordinarios. Mira el tráiler, revisa la crítica y encuentra tu próxima obsesión.
                </p>
 
                <button class="btn-primary">
                    <span>EXPLORAR CATÁLOGO</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <polyline points="19 12 12 19 5 12"></polyline>
                    </svg>
                </button>
            </div>
        </main>
 
        <footer class="bottom-bar">
            <div class="slide-indicator">
                <span class="number">03</span>
                <span class="line-indicator"></span>
                <span class="label">IMPRESCINDIBLES</span>
            </div>
        </footer>
 
    </div>
 
</body>
</html>
